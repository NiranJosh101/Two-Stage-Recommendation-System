apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      service: data-api
  template:
    metadata:
      labels:
        service: data-api
    spec:
      containers:
      - name: data-service
        image: your-dockerhub-user/data-service:latest
        envFrom:
        - configMapRef:
            name: data-service-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-service-secrets
              key: DB_PASSWORD
        ports:
        - containerPort: 8000