apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast
  namespace: recsys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feast
  template:
    metadata:
      labels:
        app: feast
    spec:
      containers:
      - name: feast
        image: feastdev/feast:latest
        command: ["feast", "serve"]
        env:
        - name: FEAST_STORE_TYPE
          value: "postgres"
        - name: FEAST_POSTGRES_HOST
          value: "postgres"
        - name: FEAST_POSTGRES_PORT
          value: "5432"
        - name: FEAST_POSTGRES_DB
          value: "recsys_db"
        - name: FEAST_POSTGRES_USER
          value: "postgres"
        - name: FEAST_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-service-secrets
              key: DB_PASSWORD
        ports:
        - containerPort: 6566