name: Continuous Training (CT) Pipeline

on:
  repository_dispatch:
    types: [retrain_models]

jobs:
  trigger-k8s-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to K8s
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Training Job to Cluster
        id: deploy
        run: |
          # Create a unique ID for this specific run
          export JOB_ID=$(date +%s)
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          
          # Inject the ID into the template and apply
          envsubst < k8s/training-job.yaml | kubectl apply -f -
          
          echo "Job model-training-$JOB_ID submitted to K8s."

      - name: Stream Training Logs
        run: |
          # This lets you see your Python output in the GHA console
          JOB_NAME="model-training-${{ steps.deploy.outputs.job_id }}"
          echo "Waiting for pod to initialize..."
          sleep 10
          kubectl logs -f job/$JOB_NAME -n ml-system --all-containers=true

      - name: Verify Job Completion
        run: |
          JOB_NAME="model-training-${{ steps.deploy.outputs.job_id }}"
          status=$(kubectl get job $JOB_NAME -n ml-system -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')
          
          if [ "$status" != "True" ]; then
            echo "❌ Job failed or did not promote models. Check MLflow for details."
            exit 1
          fi
          echo "✔ CT Pipeline successful. Job cleaned up."