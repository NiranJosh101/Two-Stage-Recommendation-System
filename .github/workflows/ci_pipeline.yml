name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      # Runs all service tests in parallel
      matrix:
        service: [
          "data-service", 
          "embedding-service", 
          "retrieval-service", 
          "ranking-service", 
          "gateway-service"
        ]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio  # Ensure test runners are present

      - name: Run Pytest
        # We use 'pytest' to execute the Unit and Integration tests we wrote
        run: |
          cd ${{ matrix.service }}
          pytest tests/ --cov=src --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: ${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}