name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          "data-service", 
          "embedding-service", 
          "retrieval-service", 
          "ranking-service", 
          "gateway-service",
          "model-training-service" # Added this one back!
        ]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches our Dockerfiles
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Pytest
        run: |
          cd ${{ matrix.service }}
          pytest tests/ --cov=src --cov-report=xml

  # --- Phase 2: Build & Push (The "Warehouse" Step) ---
  build-and-push:
    needs: service-tests # Only build if tests pass!
    if: github.event_name == 'push' # Don't push images on Pull Requests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["data-service", "embedding-service", "retrieval-service", "ranking-service", "gateway-service", "model-training-service"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Tag
        id: prep
        run: |
          # Creates a tag like: v1.0.2 or main-a1b2c3d
          TAG_NAME=$(echo ${GITHUB_REF##*/} | sed 's/\//-/g')-$(git rev-parse --short HEAD)
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.prep.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest