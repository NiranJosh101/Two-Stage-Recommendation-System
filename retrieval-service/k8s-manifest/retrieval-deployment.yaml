apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: recsys
spec:
  replicas: 3 # Increased replicas for high-concurrency retrieval
  selector:
    matchLabels:
      app: retrieval
  template:
    metadata:
      labels:
        app: retrieval
    spec:
      containers:
      - name: retrieval-engine
        image: your-registry/retrieval-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: USER_EMBEDDING_URL
          value: "http://user-embedding-service/vectorize" # Internal DNS
        - name: PINECONE_INDEX_NAME
          value: "job-embeddings"
        - name: PINECONE_ENVIRONMENT
          value: "us-east-1-gcp"
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: pinecone-secrets
              key: PINECONE_API_KEY

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector.monitoring.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "retrieval-service" 
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"

        # LIVENESS PROBE: Restarts the pod if the service becomes unresponsive
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 60 # Start checking after the app has definitely started
          periodSeconds: 20