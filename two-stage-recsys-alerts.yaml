apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ml-infra-alerts
  namespace: monitoring
  labels:
    release: monitoring # Must match your Helm install name
spec:
  groups:
  - name: ML-Pipeline-Infra
    rules:
    # 1. ALERT: Memory usage > 90% (Predictive of OOMKill)
    - alert: MLServiceHighMemoryUsage
      expr: |
        (container_memory_working_set_bytes{container!=""} / container_spec_memory_limit_bytes{container!=""}) > 0.90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High Memory on {{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} is using > 90% of its memory limit. Embedding or Ranking services might crash soon."

    # 2. ALERT: CPU Throttling (The "Latency Killer")
    - alert: MLServiceCPUThrottled
      expr: |
        increase(container_cpu_cfs_throttled_periods_total[5m]) 
        / 
        increase(container_cpu_cfs_periods_total[5m]) > 0.20
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "CPU Throttling on {{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} is being throttled. This will cause p99 latency spikes in your recommendation pipeline."

    # 3. ALERT: Pod Restarting (Service Instability)
    - alert: MLServiceRestartingTooFast
      expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Service {{ $labels.container }} is restarting"
        description: "Service {{ $labels.container }} in namespace {{ $labels.namespace }} has restarted more than 3 times in 15 minutes."