apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recsys-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/recsys-gitops.git' # Points to Repo 2
    targetRevision: HEAD
    path: k8s # The folder inside Repo 2 where the yamls are
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: recsyss # The namespace where your system runs
  syncPolicy:
    automated:
      selfHeal: true # Automatically fixes manual cluster changes